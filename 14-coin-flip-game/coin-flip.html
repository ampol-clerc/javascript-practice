<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Flip</title>
  </head>

  <style>
    button {
      height: 100px;
      width: 100px;
    }
  </style>
  <body>
    <h1>Coin Flip Game</h1>

    <!-- 
      Algorithm
      1. Computer randomly number selects a move (randomNumber)
      2. Compare the moves to get the result
      3. Update a score
      4. Display the result
    -->

    <button onclick="playGame('heads')">heads</button>
    <button onclick="playGame('tails')">tails</button>

    <script>
      // Score Object
      let score = {
        wins: 0,
        losses: 0,
      };

      // Check randomNumber and save in result
      // if number is less than 0.5 then display "heads", else "tails" in the console
      /* let result;
      if (randomNumber < 0.5) {
        result = "heads";
      } else {
        result = "tails";
      } */

      /* const guess = "heads";
      if (guess === result) {
        console.log("You win!");
      } else {
        console.log("You lose!");
      } */

      function playGame(guess) {
        // Check the user selection
        console.log("User selected:", guess);

        // Generate a random number
        const randomNumber = Math.random();

        // Switch into Ternary Operators (condition ? A : B)
        const result = randomNumber < 0.5 ? "heads" : "tails";
        console.log("Computer random:", result);

        console.log(guess === result ? "You win!" : "You lose!");

        // Update the score each time after playing
        if (guess === result) {
          score.wins++;
        } else {
          score.losses++;
        }
        console.log(score);
      }
    </script>
  </body>
</html>
