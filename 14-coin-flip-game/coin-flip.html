  <body>
    <h1>Coin Flip Game</h1>

    <!-- 
      Algorithm
      1. Computer randomly number selects a move (randomNumber)
      2. Compare the moves to get the result
      3. Display the result
    -->

    <script>
      // Generate a random number
      const randomNumber = Math.random();

      // Check randomNumber and save in result
      // if number is less than 0.5 then display "heads", else "tails" in the console
      /* let result;
      if (randomNumber < 0.5) {
        result = "heads";
      } else {
        result = "tails";
      } */

      // Switch into Ternary Operators (condition ? A : B)
      const result = randomNumber < 0.5 ? "heads" : "tails";
      console.log("Computer random:", result);

      /* const guess = "heads";
      if (guess === result) {
        console.log("You win!");
      } else {
        console.log("You lose!");
      } */
      const guess = "heads";
      console.log(guess === result ? "You win!" : "You lose!");
    </script>
