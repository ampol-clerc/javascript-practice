<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Projects</title>
  </head>

  <body>
    <!-- Document Object Model (DOM) - Projects -->

    <!-- YouTube subscribe button -->
    <p>YouTube Subscribe Button</p>
    <button class="js-subscribe-button" onclick="subscribe()">Subscribe</button>

    <!-- Rock Paper Scissors Game -->
    <p>Rock Paper Scissors</p>
    <a href="./rock-paper-scissor.html">Click here</a>

    <!-- Amazon shipping calculator -->
    <!-- 
    Steps:
    1. Get the text in the text box
    2. if amount < $40, add $10
    3. Display total on the page
     -->
    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>
    <input placeholder="Cost of order" />
    <button>Calculate</button>

    <script>
      /* 
      Process for JavaScript
      1. Figure out what steps we need (algorithm)
      2. Convert these steps in code 
      */

      function subscribe() {
        const buttonElement = document.querySelector(".js-subscribe-button");

        if (buttonElement.innerText === "Subscribe") {
          buttonElement.innerHTML = "Subscribed";
        } else {
          buttonElement.innerHTML = "Subscribe";
        }
      }
    </script>
  </body>
</html>
