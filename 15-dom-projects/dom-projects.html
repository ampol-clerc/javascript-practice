<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Projects</title>

    <style>
      body {
        font-family: Arial;
      }

      .subscribe-button {
        border: none;
        background-color: black;
        color: white;
        padding: 10px;
        padding-left: 15px;
        padding-right: 15px;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;

        margin-bottom: 30px;
      }

      .is-subscribed {
        background-color: rgb(240, 240, 240);
        color: black;
      }

      .cost-input {
        font-size: 15px;
        padding: 10px;
      }

      .calculate-button {
        font-size: 15px;
        border: none;
        background-color: green;
        color: white;
        padding: 12px 15px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <!-- Document Object Model (DOM) - Projects -->

    <!-- YouTube subscribe button -->
    <p>YouTube Subscribe Button</p>
    <button class="js-subscribe-button subscribe-button" onclick="subscribe()">
      Subscribe
    </button>
    <p></p>

    <!-- Rock Paper Scissors Game -->
    <p>Rock Paper Scissors</p>
    <a href="./rock-paper-scissor.html">Click here</a>
    <p style="padding-bottom: 30px"></p>

    <!-- Amazon shipping calculator -->
    <!-- 
    Steps:
    1. Get the text in the text box
    2. if amount < $40, add $10
    3. Display total on the page
     -->
    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>
    <input
      placeholder="Cost of order"
      class="js-cost-input cost-input"
      onkeydown="handleCostKeydown(event)"
    />
    <button class="calculate-button" onclick="calculateTotal()">
      Calculate
    </button>
    <!-- Display total cost on the page -->
    <p class="js-total-cost"></p>

    <script>
      /* 
      Process for JavaScript
      1. Figure out what steps we need (algorithm)
      2. Convert these steps in code 
      */

      function subscribe() {
        const buttonElement = document.querySelector(".js-subscribe-button");

        if (buttonElement.innerText === "Subscribe") {
          buttonElement.innerHTML = "Subscribed";
          buttonElement.classList.add("is-subscribed");
        } else {
          buttonElement.innerHTML = "Subscribe";
          buttonElement.classList.remove("is-subscribed");
        }
      }

      function calculateTotal() {
        const inputElement = document.querySelector(".js-cost-input");
        // Nmber(): convert string value from <input> to a number for accurate mathematical calculations
        let cost = Number(inputElement.value);

        if (cost < 40) {
          cost += 10;
        }

        document.querySelector(".js-total-cost").innerHTML = `$${cost}`;
      }

      // Keyboard event
      function handleCostKeydown(event) {
        console.log(event.key);

        if (event.key === "Enter") {
          calculateTotal();
        }
      }
    </script>
  </body>
</html>
