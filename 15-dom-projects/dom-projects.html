<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Projects</title>

    <link rel="stylesheet" href="./styles/dom-projects.css" />
  </head>

  <body>
    <!-- 
    Document Object Model (DOM) - Mini Projects 
      1. YouTube Subscribe Button
      2. Rock Paper Scissors Game
      3. Amazon Shipping Calculator
    -->

    <!-- YouTube subscribe button -->
    <p>YouTube Subscribe Button</p>
    <button class="js-subscribe-button subscribe-button" onclick="subscribe()">
      Subscribe
    </button>
    <p></p>

    <!-- Rock Paper Scissors Game -->
    <p>Rock Paper Scissors</p>
    <a href="./rock-paper-scissor.html">Click here</a>
    <p style="padding-bottom: 30px"></p>

    <!-- Amazon shipping calculator -->
    <!-- 
    Steps:
    1. Get the text in the text box
    2. if amount < $40, add $10
    3. Display total on the page
     -->
    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>
    <input
      placeholder="Cost of order"
      class="js-cost-input cost-input"
      onkeydown="handleCostKeydown(event)"
    />
    <button class="calculate-button" onclick="calculateTotal()">
      Calculate
    </button>
    <!-- Display total cost on the page -->
    <p class="js-total-cost"></p>

    <script src="./scripts/dom-projects.js"></script>
  </body>
</html>
