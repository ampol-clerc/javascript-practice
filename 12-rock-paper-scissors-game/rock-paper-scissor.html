<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="./rock-paper-scissor.css" />
  </head>

  <body>
    <p class="title">Rock Paper Scissors</p>

    <!-- Button: Rock -->
    <button class="move-button" onclick="playGame('rock')">
      <img class="move-icon" src="./images/rock-emoji.png" alt="rock-emoji" />
    </button>

    <!-- Button: Paper -->
    <button class="move-button" onclick="playGame('paper')">
      <img class="move-icon" src="./images/paper-emoji.png" alt="paper-emoji" />
    </button>

    <!-- Button: Scissors -->
    <button class="move-button" onclick="playGame('scissors')">
      <img
        class="move-icon"
        src="./images/scissors-emoji.png"
        alt="scissors-emoji"
      />
    </button>

    <!-- Display result on the page -->
    <p class="js-result result"></p>
    <p class="js-moves"></p>

    <!-- Display score on the page -->
    <p class="js-score score"></p>

    <!-- Button: Reset Score -->
    <button
      class="reset-score-button"
      onclick="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;

        // remove the score from local storage
        localStorage.removeItem('score');
        updateScoreElement();
      "
    >
      Reset Score
    </button>

    <script src="./rock-paper-scissor.js"></script>
  </body>
</html>
