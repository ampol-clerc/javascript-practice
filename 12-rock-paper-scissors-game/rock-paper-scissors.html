<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
  </head>

  <body>
    <h1>Rock Paper Scissors</h1>

    <!-- 
      Algorithm (Rock Paper Scissors)
      :When we click a button
      1. Computer randomly selects a move
      2. Compare the moves to get the result
      3. Update a score
      4. Display the result and score in a popup
    -->

    <!-- Button: Rock -->
    <button onclick="playGame('rock')">Rock</button>

    <!-- Button: Paper -->
    <button onclick="playGame('paper')">Paper</button>

    <!-- Button: Scissors -->
    <button onclick="playGame('scissors')">Scissors</button>

    <!-- Button: Reset Score -->
    <button
      onclick="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;

        // remove the score from local storage
        localStorage.removeItem('score');
        console.log(score);
      "
    >
      Reset Score
    </button>

    <script>
      // Our score using object values
      /* const score = {
        wins: 0,
        losses: 0,
        ties: 0,
      }; */

      // Our score using JSON Object and the Local Storage Object
      // to save score more permanently
      let score = JSON.parse(localStorage.getItem("score"));

      // console.log(score);

      // If there is no score in local storage
      // Default value
      // Check if the score is null
      if (score === null) {
        score = {
          wins: 0,
          losses: 0,
          ties: 0,
        };
      }

      function playGame(playerMove) {
        const computerMove = pickComputerMove();

        console.log("Computer picked: " + computerMove);

        let result = "";

        // Statement check: playerMove - scissors - paper - rock
        // Calculate the result
        if (playerMove === "scissors") {
          if (computerMove === "rock") {
            result = "You lose.";
          } else if (computerMove === "paper") {
            result = "You win.";
          } else if (computerMove === "scissors") {
            result = "Tie.";
          }
        } else if (playerMove === "paper") {
          if (computerMove === "rock") {
            result = "You win.";
          } else if (computerMove === "paper") {
            result = "Tie.";
          } else if (computerMove === "scissors") {
            result = "You lose.";
          }
        } else if (playerMove === "rock") {
          if (computerMove === "rock") {
            result = "Tie.";
          } else if (computerMove === "paper") {
            result = "You lose.";
          } else if (computerMove === "scissors") {
            result = "You win.";
          }
        }

        // Statement check result for updating the score
        if (result === "You win.") {
          score.wins += 1;
        } else if (result === "You lose.") {
          score.losses += 1;
        } else if (result === "Tie.") {
          score.ties += 1;
        }

        // Save in the local storage
        localStorage.setItem("score", JSON.stringify(score));

        // Display the result and score in a popup
        alert(
          `You picked ${playerMove}. Computer picked ${computerMove}. ${result}
Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`,
        );

        console.log("Result: " + result);
        console.log("Wins score: " + score.wins);
        console.log("Losses score: " + score.losses);
        console.log("Ties score: " + score.ties);
      }

      function pickComputerMove() {
        const randomNumber = Math.random();

        let computerMove = "";

        // Statement check: randomNumber
        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = "rock";
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = "paper";
        } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
          computerMove = "scissors";
        }

        return computerMove;
      }
    </script>
  </body>
</html>
