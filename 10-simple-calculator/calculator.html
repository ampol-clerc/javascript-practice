<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>

  <body>
    <h1>Calculator</h1>

    <!-- Rows 1 : 1, 2, 3 and ( + ) -->
    <p>
      <button
        onclick="
          // Use updateCalculation function
          updateCalculation('1')
        "
      >
        1
      </button>

      <button onclick="updateCalculation('2')">2</button>

      <button
        onclick="
          // Reuse function in buttons
          updateCalculation('3')
        "
      >
        3
      </button>

      <button onclick="updateCalculation(' + ')">+</button>
    </p>

    <!-- Rows 2 : 4, 5, 6 and ( - ) -->
    <p>
      <button onclick="updateCalculation('4')">4</button>

      <button onclick="updateCalculation('5')">5</button>

      <button onclick="updateCalculation('6')">6</button>

      <button onclick="updateCalculation(' - ')">-</button>
    </p>

    <!-- Rows 3 : 7, 8, 9 and ( * ) -->
    <p>
      <button onclick="updateCalculation('7')">7</button>

      <button onclick="updateCalculation('8')">8</button>

      <button onclick="updateCalculation('9')">9</button>

      <button onclick="updateCalculation(' * ')">*</button>
    </p>

    <!-- Rows 4 : 0, ( . ), ( = ) and ( / ) -->
    <p>
      <button onclick="updateCalculation('0')">0</button>

      <button onclick="updateCalculation('.')">.</button>

      <!-- Note: eval() takes a string and runs it as code. -->
      <!-- Avoid using eval() in real world projects since it can potentially be given harmful code to run. -->
      <!-- Only use eval() for learning purposes. -->
      <button
        onclick="
          calculation = eval(calculation);
          console.log(calculation);
        "
      >
        =
      </button>

      <button onclick="updateCalculation(' / ')">/</button>
    </p>

    <!-- Button : Clear -->
    <p>
      <button
        onclick="
          calculation = '';
          console.log('Cleared.');
        "
      >
        Clear
      </button>
    </p>

    <script>
      /* When the page first loads, get the calculation using .getItem()
      Use a default value of "" if a calculation doesn't exist in local storage */
      // Load initial calculation values from LocalStorage
      let calculation = localStorage.getItem("calculation") || "";

      // There's a lot of duplicated code in the buttons
      // So create a function updateCalculation and reuse the code
      function updateCalculation(value) {
        calculation += value;
        console.log(calculation);
      }
    </script>
  </body>
</html>
