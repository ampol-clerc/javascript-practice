<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>

    <link rel="stylesheet" href="./calculator.css" />
  </head>

  <body>
    <!-- <h1>Calculator</h1> -->

    <!-- Element to display the calculation -->
    <p class="js-calculation calculation"></p>

    <!-- Rows 1 : 1, 2, 3 and ( + ) -->
    <p>
      <button
        class="calculator-button gray-button"
        onclick="
          // Use updateCalculation function
          updateCalculation('1')
        "
      >
        1
      </button>

      <button
        class="calculator-button gray-button"
        onclick="updateCalculation('2')"
      >
        2
      </button>

      <button
        class="calculator-button gray-button"
        onclick="
          // Reuse function in buttons
          updateCalculation('3')
        "
      >
        3
      </button>

      <button
        class="calculator-button orange-button"
        onclick="updateCalculation(' + ')"
      >
        +
      </button>
    </p>

    <!-- Rows 2 : 4, 5, 6 and ( - ) -->
    <p>
      <button
        class="calculator-button gray-button"
        onclick="updateCalculation('4')"
      >
        4
      </button>

      <button
        class="calculator-button gray-button"
        onclick="updateCalculation('5')"
      >
        5
      </button>

      <button
        class="calculator-button gray-button"
        onclick="updateCalculation('6')"
      >
        6
      </button>

      <button
        class="calculator-button orange-button"
        onclick="updateCalculation(' - ')"
      >
        -
      </button>
    </p>

    <!-- Rows 3 : 7, 8, 9 and ( * ) -->
    <p>
      <button
        class="calculator-button gray-button"
        onclick="updateCalculation('7')"
      >
        7
      </button>

      <button
        class="calculator-button gray-button"
        onclick="updateCalculation('8')"
      >
        8
      </button>

      <button
        class="calculator-button gray-button"
        onclick="updateCalculation('9')"
      >
        9
      </button>

      <button
        class="calculator-button orange-button"
        onclick="updateCalculation(' * ')"
      >
        *
      </button>
    </p>

    <!-- Note: eval() takes a string and runs it as code. -->
    <!-- Avoid using eval() in real world projects since it can potentially be given harmful code to run. -->
    <!-- Only use eval() for learning purposes. -->
    <!-- Rows 4 : 0, ( . ), ( = ) and ( / ) -->
    <p>
      <button
        class="calculator-button gray-button"
        onclick="updateCalculation('0')"
      >
        0
      </button>

      <button
        class="calculator-button gray-button"
        onclick="updateCalculation('.')"
      >
        .
      </button>

      <button
        class="calculator-button gray-button"
        onclick="
          calculation = eval(calculation);
          // Display the calculation on the page
          displayCalculation();

          // Remember to save the calculation here
          localStorage.setItem('calculation', calculation);

          // Check the result saved to local storage
          console.log('Saved result: ', localStorage.getItem('calculation'));
        "
      >
        =
      </button>

      <button
        class="calculator-button orange-button"
        onclick="updateCalculation(' / ')"
      >
        /
      </button>
    </p>

    <!-- Button : Clear -->
    <p>
      <button
        class="calculator-button clear-button gray-button"
        onclick="
          calculation = '';
          // Display the calculation on the page
          displayCalculation();

          // Remember to save the calculation here
          localStorage.setItem('calculation', calculation);

          // Check if local storage is empty
          console.log(
            'Cleared in localStorage: ',
            localStorage.getItem('calculation'),
          );
        "
      >
        Clear
      </button>
    </p>

    <script src="./calculator.js"></script>
  </body>
</html>
