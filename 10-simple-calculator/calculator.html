<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>

  <body>
    <h1>Calculator</h1>

    <!-- Rows 1 : 1, 2, 3 and ( + ) -->
    <p>
      <button
        onclick="
          calculation += '1';
          console.log(calculation);
        "
      >
        1
      </button>

      <button
        onclick="
          calculation += '2';
          console.log(calculation);
        "
      >
        2
      </button>

      <button
        onclick="
          calculation += '3';
          console.log(calculation);
        "
      >
        3
      </button>

      <button
        onclick="
          calculation += ' + ';
          console.log(calculation);
        "
      >
        +
      </button>
    </p>

    <!-- Rows 2 : 4, 5, 6 and ( - ) -->
    <p>
      <button
        onclick="
          calculation += '4';
          console.log(calculation);
        "
      >
        4
      </button>

      <button
        onclick="
          calculation += '5';
          console.log(calculation);
        "
      >
        5
      </button>

      <button
        onclick="
          calculation += '6';
          console.log(calculation);
        "
      >
        6
      </button>

      <button
        onclick="
          calculation += ' - ';
          console.log(calculation);
        "
      >
        -
      </button>
    </p>

    <!-- Rows 3 : 7, 8, 9 and ( * ) -->
    <p>
      <button
        onclick="
          calculation += '7';
          console.log(calculation);
        "
      >
        7
      </button>

      <button
        onclick="
          calculation += '8';
          console.log(calculation);
        "
      >
        8
      </button>

      <button
        onclick="
          calculation += '9';
          console.log(calculation);
        "
      >
        9
      </button>

      <button
        onclick="
          calculation += ' * ';
          console.log(calculation);
        "
      >
        *
      </button>
    </p>

    <!-- Rows 4 : 0, ( . ), ( = ) and ( / ) -->
    <p>
      <button
        onclick="
          calculation += '0';
          console.log(calculation);
        "
      >
        0
      </button>

      <button
        onclick="
          calculation += '.';
          console.log(calculation);
        "
      >
        .
      </button>

      <!-- Note: eval() takes a string and runs it as code. -->
      <!-- Avoid using eval() in real world projects since it can potentially be given harmful code to run. -->
      <!-- Only use eval() for learning purposes. -->
      <button
        onclick="
          calculation = eval(calculation);
          console.log(calculation);
        "
      >
        =
      </button>

      <button
        onclick="
          calculation += ' / ';
          console.log(calculation);
        "
      >
        /
      </button>
    </p>

    <script>
      let calculation = "";
    </script>
  </body>
</html>
